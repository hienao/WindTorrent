name: Publish Android Internal Testing

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: google-play-internal
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: google-play-internal
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Restore release credentials
        shell: bash
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_B64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$PLAY_SERVICE_ACCOUNT_JSON_B64"

          keystore_file="$RUNNER_TEMP/windwalker-upload-key.jks"
          play_credentials_file="$RUNNER_TEMP/windwalker-play-credentials.json"

          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$keystore_file"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON_B64" | base64 --decode > "$play_credentials_file"
          test -s "$keystore_file"
          test -s "$play_credentials_file"

          {
            echo "ANDROID_KEYSTORE_FILE=$keystore_file"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
            echo "PLAY_SERVICE_ACCOUNT_FILE=$play_credentials_file"
          } >> "$GITHUB_ENV"

      - name: Publish App Bundle to Internal Testing as Draft
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :app:publishReleaseBundle

      - name: Remove release credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/windwalker-upload-key.jks"
          rm -f "$RUNNER_TEMP/windwalker-play-credentials.json"
