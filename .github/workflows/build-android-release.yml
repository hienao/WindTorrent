name: Build Android Beta or Release

on:
  push:
    branches:
      - beta
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-merged-pr-and-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      channel: ${{ steps.version.outputs.channel }}
      play_track: ${{ steps.version.outputs.play_track }}
      version_code: ${{ steps.version.outputs.version_code }}
      version_name: ${{ steps.version.outputs.version_name }}
      artifact_name: ${{ steps.version.outputs.artifact_name }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      merged_pr_number: ${{ steps.merged_pr.outputs.number }}
    steps:
      - name: Require a merged pull request
        id: merged_pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          AFTER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          pull_requests="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/$REPOSITORY/commits/$AFTER_SHA/pulls")"
          matching_pr="$(jq -c \
            --arg branch "$BRANCH" \
            --arg sha "$AFTER_SHA" \
            '[.[] | select(
              .merged_at != null and
              .base.ref == $branch and
              .merge_commit_sha == $sha
            )] | first // empty' <<< "$pull_requests")"

          if [[ -z "$matching_pr" ]]; then
            echo "Build rejected: $AFTER_SHA was not created by merging a pull request into $BRANCH." >&2
            exit 1
          fi

          jq -r '"number=" + (.number | tostring)' <<< "$matching_pr" >> "$GITHUB_OUTPUT"

      - name: Check out merged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require an increased versionCode
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          version_value() {
            git show "$1:pubspec.yaml" |
              sed -nE 's/^version:[[:space:]]*([^[:space:]#]+).*$/\1/p' |
              head -n 1
          }

          previous_version="$(version_value "$BEFORE_SHA")"
          current_version="$(version_value "$AFTER_SHA")"
          previous_code="${previous_version##*+}"
          current_code="${current_version##*+}"
          current_name="${current_version%%+*}"

          if [[ ! "$previous_code" =~ ^[0-9]+$ || ! "$current_code" =~ ^[0-9]+$ ]]; then
            echo "Invalid version in pubspec.yaml. Expected version: x.y.z+versionCode." >&2
            exit 1
          fi

          if (( current_code <= previous_code )); then
            echo "Build rejected: versionCode must increase on $BRANCH ($previous_code -> $current_code)." >&2
            exit 1
          fi

          if [[ "$BRANCH" == "beta" ]]; then
            channel="beta"
            play_track="beta"
          elif [[ "$BRANCH" == "main" ]]; then
            channel="release"
            play_track="production"
          else
            echo "Unsupported target branch: $BRANCH" >&2
            exit 1
          fi

          artifact_name="WindTorrent-${channel}-${current_name}-${current_code}"
          release_tag="v${current_name}+${current_code}"
          {
            echo "channel=$channel"
            echo "play_track=$play_track"
            echo "version_code=$current_code"
            echo "version_name=$current_name"
            echo "artifact_name=$artifact_name"
            echo "release_tag=$release_tag"
          } >> "$GITHUB_OUTPUT"

          echo "Accepted $channel build: versionCode $previous_code -> $current_code"

  build-and-publish:
    needs: verify-merged-pr-and-version
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: read
    environment:
      name: google-play-internal
    steps:
      - name: Check out merged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true
          pub-cache: true

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: false

      - name: Install dependencies
        run: flutter pub get

      - name: Restore signing and Google Play credentials
        shell: bash
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_B64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$PLAY_SERVICE_ACCOUNT_JSON_B64"

          keystore_file="$RUNNER_TEMP/windtorrent-upload-key.jks"
          play_credentials_file="$RUNNER_TEMP/windtorrent-play-credentials.json"

          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$keystore_file"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON_B64" | base64 --decode > "$play_credentials_file"
          test -s "$keystore_file"
          test -s "$play_credentials_file"

          {
            echo "ANDROID_KEYSTORE_FILE=$keystore_file"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
            echo "PLAY_SERVICE_ACCOUNT_FILE=$play_credentials_file"
          } >> "$GITHUB_ENV"

      - name: Build signed App Bundle and split Release APKs
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --stacktrace :app:bundleRelease
          ./gradlew --stacktrace \
            -Pwindtorrent.splitApks=true \
            :app:assembleRelease

      - name: Prepare release artifacts
        env:
          ARTIFACT_NAME: ${{ needs.verify-merged-pr-and-version.outputs.artifact_name }}
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/release-artifacts"
          play_dir="$RUNNER_TEMP/play-artifact"
          mkdir -p "$release_dir" "$play_dir"

          declare -A apk_sources=(
            [universal]="build/app/outputs/apk/release/app-universal-release.apk"
            [arm64-v8a]="build/app/outputs/apk/release/app-arm64-v8a-release.apk"
            [armeabi-v7a]="build/app/outputs/apk/release/app-armeabi-v7a-release.apk"
            [x86_64]="build/app/outputs/apk/release/app-x86_64-release.apk"
          )
          for variant in universal arm64-v8a armeabi-v7a x86_64; do
            source_apk="${apk_sources[$variant]}"
            test -s "$source_apk"
            install -m 0644 "$source_apk" \
              "$release_dir/$ARTIFACT_NAME-$variant.apk"
          done

          install -m 0644 build/app/outputs/bundle/release/app-release.aab \
            "$play_dir/$ARTIFACT_NAME.aab"
          (
            cd "$release_dir"
            sha256sum ./*.apk > "$ARTIFACT_NAME-SHA256SUMS.txt"
          )

          {
            echo "UNIVERSAL_APK=$release_dir/$ARTIFACT_NAME-universal.apk"
            echo "RELEASE_CHECKSUM=$release_dir/$ARTIFACT_NAME-SHA256SUMS.txt"
            echo "RELEASE_ARTIFACT_DIR=$release_dir"
            echo "PLAY_ARTIFACT_DIR=$play_dir"
          } >> "$GITHUB_ENV"

      - name: Upload temporary universal APK artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ needs.verify-merged-pr-and-version.outputs.artifact_name }}
          path: |
            ${{ env.UNIVERSAL_APK }}
            ${{ env.RELEASE_CHECKSUM }}
          if-no-files-found: error
          retention-days: 7

      - name: Publish prebuilt App Bundle to Google Play as Draft
        working-directory: android
        env:
          PLAY_TRACK: ${{ needs.verify-merged-pr-and-version.outputs.play_track }}
        run: >-
          ./gradlew --no-daemon --stacktrace :app:publishBundle
          --artifact-dir "$PLAY_ARTIFACT_DIR"
          --track "$PLAY_TRACK"
          --release-status draft

      - name: Publish APK in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify-merged-pr-and-version.outputs.release_tag }}
          RELEASE_TITLE: ${{ needs.verify-merged-pr-and-version.outputs.artifact_name }}
          CHANNEL: ${{ needs.verify-merged-pr-and-version.outputs.channel }}
          PLAY_TRACK: ${{ needs.verify-merged-pr-and-version.outputs.play_track }}
          VERSION_NAME: ${{ needs.verify-merged-pr-and-version.outputs.version_name }}
          VERSION_CODE: ${{ needs.verify-merged-pr-and-version.outputs.version_code }}
          MERGED_PR_NUMBER: ${{ needs.verify-merged-pr-and-version.outputs.merged_pr_number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          pr_data="$(gh api "/repos/$REPOSITORY/pulls/$MERGED_PR_NUMBER")"
          pr_title="$(jq -r '.title' <<< "$pr_data")"
          pr_body="$(jq -r '.body // ""' <<< "$pr_data")"
          pr_url="$(jq -r '.html_url' <<< "$pr_data")"

          notes_file="$RUNNER_TEMP/release-notes.md"
          {
            printf '## 本次更新\n\n'
            printf -- '- [#%s %s](%s)\n' "$MERGED_PR_NUMBER" "$pr_title" "$pr_url"
            if [[ -n "${pr_body//[[:space:]]/}" ]]; then
              printf '\n%s\n' "$pr_body"
            fi
            printf '\n### 提交记录\n\n'
            gh api --paginate "/repos/$REPOSITORY/pulls/$MERGED_PR_NUMBER/commits" \
              --jq '.[] | "- " + (.commit.message | split("\n")[0]) + " (`" + (.sha[0:7]) + "`)"'
            printf '\n## APK 下载说明\n\n'
            printf '%s\n' \
              '- `arm64-v8a`：绝大多数现代 Android 手机和平板' \
              '- `armeabi-v7a`：较旧的 32 位 ARM 设备' \
              '- `x86_64`：Android 模拟器及 x86_64 设备' \
              '- `universal`：包含全部架构，不确定设备架构时使用'
            printf '\n## 构建信息\n\n'
            printf -- '- Version: `%s` (`%s`)\n' "$VERSION_NAME" "$VERSION_CODE"
            printf -- '- Source commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- Google Play track: `%s` (Draft)\n' "$PLAY_TRACK"
          } > "$notes_file"

          shopt -s nullglob
          release_files=("$RELEASE_ARTIFACT_DIR"/*)
          if (( ${#release_files[@]} == 0 )); then
            echo "No GitHub Release artifacts found." >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes-file "$notes_file"
            gh release upload "$RELEASE_TAG" "${release_files[@]}" --clobber
          else
            release_args=(
              release create "$RELEASE_TAG"
              "${release_files[@]}"
              --target "$GITHUB_SHA"
              --title "$RELEASE_TITLE"
              --notes-file "$notes_file"
            )
            if [[ "$CHANNEL" == "beta" ]]; then
              release_args+=(--prerelease)
            else
              release_args+=(--latest)
            fi
            gh "${release_args[@]}"
          fi

      - name: Remove credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/windtorrent-upload-key.jks"
          rm -f "$RUNNER_TEMP/windtorrent-play-credentials.json"
