name: windwalker
description: "WindTorrent - Remote manager for Aria2, qBittorrent, and Transmission"
publish_to: 'none'
version: 1.1.4-beta.2+2026081802

environment:
  sdk: '>=3.11.0 <3.20.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.1
  go_router: ^17.2.0
  get_storage: ^2.1.1
  http: ^1.1.0
  intl: any
  in_app_review: ^2.0.10
  firebase_core: ^4.1.1
  firebase_analytics: ^12.0.2
  package_info_plus: ^10.2.0
  in_app_update: ^4.2.5
  connectivity_plus: ^7.2.0
  device_info_plus: ^13.2.0
  url_launcher: ^6.3.1
  share_plus: ^13.2.0
  # Beta: device_info_plus ^13.1.0 requires win32 ^6.0.1, conflicts with file_picker <12.
  # Track: upgrade to stable 12.x once officially released.
  # 12.0.0-beta.7 misses Android FileUtils.kt and fails compileDebugKotlin.
  file_picker: 12.0.0-beta.5
  xml: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.6.4
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: 2.4.8

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/branding/downloader_types/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "design/windwalker-icon-square-transparent.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "design/windwalker-icon-square-transparent.png"

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#0B1220"
  image: design/windwalker-icon-square-transparent.png
  image_dark: design/windwalker-icon-square-transparent.png
  android: true
  ios: false
  web: false
  fullscreen: true
  android_12:
    color: "#FFFFFF"
    color_dark: "#0B1220"
    image: design/windwalker-icon-splashsafe.png
    image_dark: design/windwalker-icon-splashsafe.png
    icon_background_color: "#FFFFFF"
    icon_background_color_dark: "#0B1220"
