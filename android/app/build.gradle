plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
    id "com.github.triplet.play"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

// Parse version from pubspec.yaml to avoid stale local.properties values when
// building directly with Gradle (e.g. publishReleaseBundle).
def pubspecVersionLine = rootProject.file('../pubspec.yaml').readLines('UTF-8')
        .find { it.trim().startsWith('version:') }
if (pubspecVersionLine == null) {
    throw new GradleException("Missing 'version' in pubspec.yaml")
}
def pubspecVersionRaw = pubspecVersionLine.split(':', 2)[1].trim()
def pubspecVersionParts = pubspecVersionRaw.split('\\+')
def appVersionName = pubspecVersionParts[0].trim()
def appVersionCode = (pubspecVersionParts.length > 1)
        ? pubspecVersionParts[1].trim()
        : "1"
if (!(appVersionCode ==~ /\d+/)) {
    throw new GradleException("Invalid pubspec build number: '${appVersionCode}'. Use version: x.y.z+number")
}

// Load signing config from key.properties
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

def envOrProp = { String envKey, String propKey = null ->
    def envValue = System.getenv(envKey)
    if (envValue != null && envValue.trim()) {
        return envValue
    }
    if (propKey != null) {
        def propValue = keystoreProperties.getProperty(propKey)
        if (propValue != null && propValue.trim()) {
            return propValue
        }
    }
    return null
}

def signingStoreFile = envOrProp('ANDROID_KEYSTORE_FILE', 'storeFile')
def signingStorePassword = envOrProp('ANDROID_KEYSTORE_PASSWORD', 'storePassword')
def signingKeyAlias = envOrProp('ANDROID_KEY_ALIAS', 'keyAlias')
def signingKeyPassword = envOrProp('ANDROID_KEY_PASSWORD', 'keyPassword')
def hasReleaseSigning = signingStoreFile && signingStorePassword && signingKeyAlias && signingKeyPassword
def playCredentialsPath = System.getenv('PLAY_SERVICE_ACCOUNT_FILE')
def playCredentialsFile = (playCredentialsPath != null && playCredentialsPath.trim())
        ? file(playCredentialsPath)
        : rootProject.file("play-credentials.json")

android {
    namespace "com.hienao.windtorrent"
    compileSdkVersion flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    signingConfigs {
        projectKeystore {
            keyAlias signingKeyAlias
            keyPassword signingKeyPassword
            storeFile signingStoreFile ? file(signingStoreFile) : null
            storePassword signingStorePassword
        }
        release {
            keyAlias signingKeyAlias
            keyPassword signingKeyPassword
            storeFile signingStoreFile ? file(signingStoreFile) : null
            storePassword signingStorePassword
        }
    }

    defaultConfig {
        applicationId "com.hienao.windtorrent"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode appVersionCode.toInteger()
        versionName appVersionName
    }

    buildTypes {
        debug {
            signingConfig hasReleaseSigning ? signingConfigs.projectKeystore : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
        profile {
            signingConfig hasReleaseSigning ? signingConfigs.projectKeystore : signingConfigs.debug
        }
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.projectKeystore
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

// Gradle configures every build type even when only assembleDebug is requested.
// Validate signing after task selection so public CI can build Debug without
// release credentials while every Release task still fails fast when unsigned.
gradle.taskGraph.whenReady { taskGraph ->
    def releaseTaskRequested = taskGraph.allTasks.any { task ->
        task.name.toLowerCase().contains('release')
    }
    if (releaseTaskRequested && !hasReleaseSigning) {
        throw new GradleException("Release signing is not fully configured. Please set ANDROID_KEYSTORE_FILE, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD.")
    }
}

flutter {
    source '../..'
}

dependencies {
}

play {
    // Play credentials are required only for publishing. Local debug builds and
    // public CI must remain usable without access to release secrets.
    if (playCredentialsFile.exists()) {
        serviceAccountCredentials = playCredentialsFile
    }
    track = "internal"
    releaseStatus = com.github.triplet.gradle.androidpublisher.ReleaseStatus.DRAFT
    defaultToAppBundles = true
}

tasks.matching { it.name == "publishReleaseBundle" }.configureEach {
    doFirst {
        if (!playCredentialsFile.exists()) {
            throw new GradleException("Google Play credentials file not found. Set PLAY_SERVICE_ACCOUNT_FILE for publishing.")
        }
    }
}
